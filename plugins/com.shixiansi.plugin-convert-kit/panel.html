<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>换算工具</title>
<!--
  配色在样式表绘制之前先落一次：宿主把 ?theme=light|dark 放在帧地址上。开着时用户再切，
  由 app.js 接 theme 消息。
-->
<script>
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  })();
</script>
<!--
  一个文档，两种挂载（由 init 的 surface.slot 决定，不猜 kind——常驻帧的 kind 也是 panel）：
    slot 'background'   桌宠挂的常驻帧：什么都不画，只答 plugin.call 的 convert。
                        这是本插件真正工作的地方——模型或别的插件问它时没有界面开着。
    slot 'workshop'     控制中心插件页：手动换算（值 + 两个单位），看支持的单位表。

  本插件没有 surface（无浮层面），是纯面板型：ui.css 从 docs/ui 复制（.card/.btn 的阴影与
  hover 位移在正常滚动的容器里是安全的，手册 §8.6）。
-->
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root" class="view-workshop">
  <main id="workshop" class="workshop">
    <header class="head head-stack">
      <div class="chips">
        <span class="chip" id="chip-slot">换算工具</span>
        <span class="chip" id="chip-state">读取中…</span>
      </div>
      <p class="lede">
        单位、进制、时区偏移，全部内置表、零网络。别的插件和模型用
        <code>plugin.call</code> 问它 <code>convert</code>；认不出的单位它会点名拒绝，不猜。
      </p>
    </header>

    <section class="card">
      <h2>换一行</h2>
      <form id="conv-form" class="conv-row">
        <input id="conv-value" class="input" type="text" inputmode="decimal" placeholder="数值，如 1、-3.5、255" maxlength="40" aria-label="数值">
        <input id="conv-from" class="input" type="text" placeholder="从，如 km / hex / UTC+8" maxlength="24" aria-label="原始单位">
        <span class="arrow">→</span>
        <input id="conv-to" class="input" type="text" placeholder="到，如 mi / bin / UTC-5" maxlength="24" aria-label="目标单位">
        <button id="conv-go" class="btn primary" type="submit">换算</button>
      </form>
      <p id="conv-result" class="result" role="status" aria-live="polite"></p>
      <p class="hint">试一下：<button type="button" class="linkish" data-q="1km to mi">1km to mi</button>、<button type="button" class="linkish" data-q="100°C to °F">100°C to °F</button>、<button type="button" class="linkish" data-q="255 dec to hex">255 dec to hex</button>、<button type="button" class="linkish" data-q="14 UTC+8 to UTC-5">14 UTC+8 to UTC-5</button>、<button type="button" class="linkish" data-q="1.5 GB to MiB">1.5 GB to MiB</button></p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>支持的单位</h2>
      </div>
      <table class="units">
        <tbody id="units-body"></tbody>
      </table>
      <p class="hint">进制用 bin / oct / dec / hex（或 2/8/10/16）；时区写成 UTC+8 / UTC-05:30。大小写不敏感（KB 与 kb 同类）。</p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>最近换过</h2>
        <button id="history-clear" class="btn soft" type="button">清空</button>
      </div>
      <table class="history">
        <thead>
          <tr><th>时间</th><th>输入</th><th>结果</th></tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
      <p id="history-empty" class="muted">还没有记录。</p>
    </section>

    <p id="status" class="status"></p>
  </main>
</div>

<!--
  经典 script，共享一个全局作用域（'use strict' 各自生效），不需要 import/export。
  加模块时：这里加一行，并把文件写进 manifest.json 的 assets（否则不会被打包）。
-->
<script src="lib/convert.js"></script>
<script src="app.js"></script>
</body>
</html>
