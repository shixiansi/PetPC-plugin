<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>邮件智能摘要</title>
  <script>
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root">
    <main id="workshop" class="workshop hidden">
      <header class="head head-stack">
        <div class="chips">
          <span class="chip" id="chip-state">邮件摘要</span>
        </div>
        <p class="lede">
          从邮件桥抓最新未读，本地先过一遍垃圾词；剩下的交给记忆核心一次性分类（紧急/常规/垃圾）
          并给紧急的写摘要；到点或手动触发时弹气泡、可语音播报。
        </p>
      </header>

      <section class="card">
        <h2>最近一批</h2>
        <div class="stats">
          <div class="stat"><span class="stat-label">抓到</span><span class="stat-value" id="stat-total">0</span></div>
          <div class="stat"><span class="stat-label">紧急</span><span class="stat-value" id="stat-urgent">0</span></div>
          <div class="stat"><span class="stat-label">垃圾</span><span class="stat-value" id="stat-spam">0</span></div>
        </div>
        <div class="actions">
          <button id="digest-now" class="btn primary" type="button">立即生成摘要</button>
        </div>
        <ul id="mail-list" class="mail-list"></ul>
        <p id="mail-empty" class="muted">还没有生成过摘要。点「立即生成摘要」或等到每日推送时间。</p>
      </section>

      <section class="card">
        <h2>历史</h2>
        <ul id="log-list" class="log-list"></ul>
        <p id="log-empty" class="muted">还没有记录。</p>
      </section>

      <p id="status-note" class="status"></p>
      <p id="status-error" class="status error"></p>
    </main>
  </div>

  <script src="lib/core.js"></script>
  <script src="lib/mime.js"></script>
  <script src="lib/bridge.js"></script>
  <script src="lib/digest.js"></script>
  <script src="lib/workshop.js"></script>
  <script src="app.js"></script>
</body>
</html>
