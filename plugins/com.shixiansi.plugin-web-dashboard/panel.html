<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>桌宠状态看板</title>
  <script>
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root">
    <main id="workshop" class="workshop hidden">
      <header class="head head-stack">
        <div class="chips">
          <span class="chip" id="chip-state">看板</span>
        </div>
        <p class="lede">
          所有插件状态的汇总视图：数据由各插件通过 plugin.call 的 stats 现答，
          桥（tools/dashboard-bridge.mjs）把它变成浏览器里能打开的一个页面。
        </p>
      </header>

      <section class="card-grid">
        <section class="card" id="card-todo"></section>
        <section class="card" id="card-pomodoro"></section>
        <section class="card" id="card-chat"></section>
      </section>

      <section class="card-grid">
        <section class="card">
          <h2>待办分布</h2>
          <div id="bars-todo" class="chart"></div>
        </section>
        <section class="card">
          <h2>专注统计</h2>
          <div id="bars-pomodoro" class="chart"></div>
        </section>
      </section>

      <section class="card">
        <h2>反向控制</h2>
        <div class="actions">
          <button id="refresh-now" class="btn primary" type="button">立即刷新数据</button>
          <button id="cmd-pause-todo" class="btn secondary" type="button">让番茄钟暂停</button>
          <button id="cmd-say-hi" class="btn ghost" type="button">让桌宠打招呼</button>
        </div>
        <p class="hint">「让番茄钟暂停」写它自己监听的共享命令键；「打招呼」弹一个气泡。数据采集不会因此变慢。</p>
      </section>

      <p id="status-note" class="status"></p>
      <p id="status-error" class="status error"></p>
    </main>
  </div>

  <script src="lib/core.js"></script>
  <script src="lib/collect.js"></script>
  <script src="lib/bridge.js"></script>
  <script src="lib/workshop.js"></script>
  <script src="app.js"></script>
</body>
</html>
