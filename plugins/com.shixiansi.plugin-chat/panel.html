<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>对话插件</title>
<!--
  The market window's colour scheme, applied BEFORE the stylesheet paints: the host
  puts `?theme=light|dark` on the frame URL so a light window does not flash a dark
  panel. app.js takes over for a switch that happens while this frame is running.
-->
<script>
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="./style.css">
</head>
<!-- ONE document, THREE appearances.
     The host mounts this file in two different places: inside the conversation
     slot (the panel, where it fills a 380x520 area) and once per declared
     floating rectangle (the 300x44 reply strip and the 300x66 input pill, both above
     the pet). `app.js` reads `surface.kind` and `surface.rectIndex`
     from the `init` frame and swaps the root class between `view-panel` /
     `view-card` / `view-bar`, which is what turns one document into the right
     shape for each block.

     The two floating blocks are placed by the manifest, BOTH above the pet and both
     centred on it: the reply strip on top, and the input pill underneath it with a tail
     pointing down at the pet's head. They are 300 wide and the pet is 150, so the input is
     readable and the tail stays centred. Nothing in this file decides any of that - the
     numbers live in manifest.json and the host crops the window to them, tail band
     included, which is why the tail is drawn inside the declared rectangle. -->
<body id="root" class="view-panel" data-surface="panel" data-shape="view-panel">
<header class="bar">
  <span class="title">对话插件</span>
  <span id="status" class="status" role="status" aria-live="polite">等待宿主初始化…</span>
</header>

<!-- The message list owns the scroll: it is the only element that grows, and
     `overflow-y:auto` plus `min-height:0` keeps that growth inside the box
     instead of pushing the composer out of it.

     In the PANEL it shows the whole transcript. In the floating reply card it
     shows ONLY the latest reply - `app.js`'s `renderHistory` decides which, from
     the same `history` array, so the record is never lost, only not shown. -->
<main id="reply" class="reply" aria-live="polite"></main>

<footer class="compose">
  <textarea id="prompt" class="prompt" rows="1" aria-label="消息" disabled></textarea>
  <div class="actions">
    <!-- The send button is an ICON, not the word 发送. Its accessible name is the
         aria-label, so a screen reader still announces it; the glyph is an inline
         SVG rather than a font or an image file because this document runs in an
         opaque-origin sandbox and must not fetch anything. The path is
         `ph:paper-plane-tilt-fill` from Iconify. -->
    <button id="send" type="button" class="btn primary icon-only" aria-label="发送" title="发送" disabled>
      <svg class="icon" viewBox="0 0 256 256" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M231.4 44.34v.15l-58.2 191.94a15.88 15.88 0 0 1-14 11.51q-.69.06-1.38.06a15.86 15.86 0 0 1-14.42-9.15l-36.4-74.7a4 4 0 0 1 .77-4.58l57.92-57.92a8 8 0 0 0-11.31-11.31l-57.95 57.92a4 4 0 0 1-4.58.77l-74.77-36.39a16 16 0 0 1 2.49-29.8l191.94-58.2h.15a16 16 0 0 1 19.74 19.7"/>
      </svg>
    </button>
    <button id="stop" type="button" class="btn" disabled>停止</button>
    <button id="bubble" type="button" class="btn" disabled>气泡</button>
    <button id="surface" type="button" class="btn" disabled>浮层面</button>
  </div>
</footer>

<script type="module" src="./app.js"></script>
</body>
</html>
