<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>日程日历</title>
<!--
  配色在样式表绘制之前先落一次：宿主把 ?theme=light|dark 放在帧地址上，首帧闪一下深色是
  控制中心里最显眼的破绽。开着的时候用户再切换，由 app.js 接 theme 消息。
-->
<script>
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  })();
</script>
<!--
  一个文档，三种挂载（由 init 的 surface 决定，别猜 kind——常驻帧的 kind 也是 panel）：
    kind 'surface'      浮层面那块卡片：今天 + 明天的日程
    slot 'background'   常驻帧：拉日历、算提醒、答 plugin.call 的 today/next/agenda
    slot 'workshop'     控制中心插件页：只读视图 + 状态
  常驻帧什么都不画（body.bg 让一切隐藏），它存在的理由是"没有界面开着时也要会前提醒"。

  不引 ui.css：本插件声明了 surface，手册 §8.6 的例外适用——ui.css 的 .card/.btn 自带
  box-shadow 与 hover transform，在被矩形裁剪的浮层面里会切出"缺一块"；调色板在 style.css
  的两个调色板块里自带（颜色一律 var(--…)，十六进制只出现在那两块里）。
-->
<link rel="stylesheet" href="./style.css">
</head>
<body id="root" class="view-boot" data-surface="boot">
<header class="bar">
  <span class="title">日程</span>
  <span id="status" class="status" role="status" aria-live="polite">等待宿主初始化…</span>
</header>

<!-- 卡片只长不高到 maxH：列表是唯一会增长的元素，overflow + min-height:0
     把滚动留在这个盒子里，不把标题栏顶出去。高度变化由 app.js 量了报 surface.blocks。 -->
<main id="card" class="card-body">
  <p id="today-label" class="day-label">今天</p>
  <div id="today" class="list"></div>
  <p id="tomorrow-label" class="day-label">明天</p>
  <div id="tomorrow" class="list"></div>
  <p id="note" class="note" hidden></p>
</main>

<script src="lib/ics.js"></script>
<script src="app.js"></script>
</body>
</html>
