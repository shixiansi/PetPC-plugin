<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>联网搜索</title>
  <!--
    控制中心的配色，在样式表绘制之前先落一次（宿主把 ?theme=light|dark 放在帧地址上）。
    已经开着的时候用户再切，由 app.js 收 theme 消息接上。
  -->
  <script>
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    })();
  </script>
  <!-- 宿主的 token 副本：iframe 是 opaque origin，宿主的 CSS 变量进不来。 -->
  <link rel="stylesheet" href="ui.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--
    一个文档，两副面孔（由 init 的 surface.slot 决定，不猜）：

      background   桌宠挂的常驻帧：什么都不画，只负责答 plugin.call 的 search。
      workshop     控制中心插件页：手动搜索（桌宠那一面才有 net.fetch）+ 最近记录。

    两段都写在标记里；workshop 面在常驻帧里整体隐藏。
  -->
  <div id="root" class="view-workshop">
    <main id="workshop" class="workshop hidden">
      <header class="head head-stack">
        <div class="chips">
          <span class="chip" id="chip-slot">联网搜索</span>
          <span class="chip" id="chip-engine">引擎：读取中…</span>
        </div>
        <p class="lede">
          给桌宠的联网能力。记忆核心在「记忆答不上」时用它先查资料再回答；这里也可以手动查。
          引擎三选一：SearXNG（自建实例，不需要密钥）、Tavily、Bing。
        </p>
      </header>

      <section class="card">
        <h2>试一下</h2>
        <div class="search-row">
          <input id="query" class="input" type="text" placeholder="要查的话…" maxlength="300" />
          <button id="go" class="btn primary" type="button" disabled>搜索</button>
        </div>
        <p class="hint desktop-only hidden">
          「试一下」要在桌宠那边的常驻帧里才能跑（控制中心不服务网络请求）。它在群聊与私聊里
          一样可用：别的插件 <code>plugin.call</code> 这个插件的 <code>search</code> 就能拿到结果。
        </p>
        <div id="results" class="results"></div>
        <p id="results-empty" class="muted">还没有搜过。输入一句话试试，或等记忆核心自己来问。</p>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>最近查过</h2>
          <button id="history-clear" class="btn soft" type="button">清空记录</button>
        </div>
        <table class="history">
          <thead>
            <tr>
              <th>时间</th>
              <th>查询</th>
              <th>引擎</th>
              <th>结果</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
        <p id="history-empty" class="muted">还没有记录。</p>
        <p class="hint">同一句话在缓存时间内直接用上一次的结果（缓存时长在设置里调）；记录条数上限也在设置里。</p>
      </section>

      <p id="status" class="status"></p>
    </main>
  </div>

  <!--
    经典 script，共享一个全局作用域（'use strict' 各自生效），不需要 import/export。
    加模块时：这里加一行，并把文件写进 manifest.json 的 assets（否则不会被打包）。
  -->
  <script src="lib/core.js"></script>
  <script src="lib/engines.js"></script>
  <script src="lib/search.js"></script>
  <script src="lib/workshop.js"></script>
  <script src="app.js"></script>
</body>
</html>
