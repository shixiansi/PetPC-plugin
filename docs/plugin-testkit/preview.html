<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>插件预览</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; display: flex; height: 100vh; font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #14161b; color: #e6e8ee;
  }
  /* The stage is deliberately NOT the card's size: the card is drawn to scale with a dashed outline,
     because "the card is 380x260" is the fact every clipping bug was about and it has to be visible. */
  #stage { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 24px; }
  #card { position: relative; outline: 1px dashed #4b5563; outline-offset: 0; }
  #card::after {
    content: attr(data-label); position: absolute; left: 0; top: -18px; font-size: 11px; color: #8b93a1;
  }
  iframe { display: block; border: 0; background: transparent; }
  /* The headless frame: hidden, and still running. Exactly what the host does
     (frontend/src/plugin-host.js `openBackground`): `display:none` keeps the document alive, so the
     plugin's state machine keeps ticking while its card is open. */
  #bgwrap[hidden] { display: none; }
  #side { flex: 0 0 420px; border-left: 1px solid #262a33; display: flex; flex-direction: column; min-height: 0; }
  #bar { padding: 8px; border-bottom: 1px solid #262a33; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #bar select, #bar button, #bar input { font: inherit; background: #1d2027; color: inherit; border: 1px solid #333844; border-radius: 6px; padding: 3px 6px; }
  #bar button { cursor: pointer; }
  #mounts { padding: 0 8px 6px; font-size: 11px; color: #8b93a1; }
  #report { padding: 8px; border-bottom: 1px solid #262a33; font-family: ui-monospace, Consolas, monospace; font-size: 11px; white-space: pre-wrap; }
  #report.ok { color: #4ade80; }
  #report.bad { color: #f87171; }
  #log { flex: 1 1 auto; overflow: auto; padding: 8px; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
  #log div { padding: 1px 0; border-bottom: 1px solid #1b1e25; }
  .dir-out { color: #93c5fd; }
  .dir-in { color: #fbbf24; }
  .err { color: #f87171; }
  .who { color: #6b7280; }
  /* bare：只留插件页面本身（--bare 用）。 */
  body.bare { display: block; }
  body.bare #stage { padding: 0; height: 100vh; }
  body.bare #card { outline: none; }
  body.bare #card::after { display: none; }
  body.bare #side { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="card" data-label="declared rect"><iframe id="frame" title="plugin surface"></iframe></div>
</div>
<!-- 常驻帧：看不见，但在跑。清单声明 `background: true` 时挂上它——番茄钟的计时器与状态机就在
     这里，浮层面只是视图。少了这个帧，点「确定」只会留下一条没人读的 command，界面上就是
     "点了没反应"（那正是这个预览器第一版看不见的东西）。 -->
<div id="bgwrap" hidden><iframe id="bgframe" title="plugin background"></iframe></div>
<div id="side">
  <div id="bar">
    <label>rect <select id="rect"></select></label>
    <label>slot <select id="slot">
      <option value="pomodoro">pomodoro</option><option value="todos">todos</option>
      <option value="chat">chat</option><option value="workshop">workshop</option>
      <option value="background">background</option>
    </select></label>
    <label>kind <select id="kind"><option value="surface">surface</option><option value="panel">panel</option></select></label>
    <label><input type="checkbox" id="deny" /> 拒绝一切</label>
    <button id="reload">重载</button>
    <button id="cfg">发 config.changed</button>
  </div>
  <div id="mounts">挂载中…</div>
  <div id="report">等待插件…</div>
  <div id="log"></div>
</div>
<script type="module">
// ---------------------------------------------------------------------------
// 预览页 = 假宿主 + 一把尺子。
//
// 假宿主**不在这个文件里**：它和 `plugin-check.mjs` 用的是同一份 `fake-host.mjs`
// （同一个协议、同一张方法表、同一张结果表）。两套假宿主必然分叉，而分叉的假宿主比没有更坏。
//
// 这个文件只做三件 jsdom 做不到的事：
//   1. iframe 的尺寸**正好**是清单里声明的矩形，外面画一圈虚线标出边界（真宿主就是这么裁的）；
//   2. 每次消息之后 + 插件每次重画，量一遍每个可见元素的 bottom/right 与文档的 scrollHeight；
//   3. 把结论同时写进右栏（给人看）与 `body[data-report]`（给 `--check` 读）。
//
// 挂几个帧？**照真宿主来**：清单声明 `background: true` 就再挂一个隐藏的常驻帧。这件事不是
// 精致度问题，是"按钮按了有没有用"的问题——番茄钟的计时器与状态机住在常驻帧里，浮层面只发一条
// `command` 出去。只挂一个帧，点「确定」会留下一条没人读的命令，屏幕上什么都不会发生，而这个
// 工具会一本正经地告诉你"布局没问题"。
//
// 与真宿主的两处**故意**的差异：
//   · 这里不加 `sandbox="allow-scripts"`：真宿主的帧是 opaque origin，而量排版要读
//     `contentDocument`，所以预览页必须同源。opaque origin 里会抛错的 API（localStorage、
//     document.cookie、new WebSocket…）由 `plugin-check.mjs` 的静态红线那组拦。
//   · 这里不做原生窗口裁剪（SetWindowRgn）：那正是"画一圈虚线"要代替的东西。
// ---------------------------------------------------------------------------
import { createFakeHost, createMemoryStore, previewAnswers } from '/testkit/fake-host.mjs';

const q = new URLSearchParams(location.search);
const params = {
  plugin: q.get('plugin') || '',
  rect: Number(q.get('rect') || 0),
  slot: q.get('slot') || 'pomodoro',
  kind: q.get('kind') || 'surface',
  // 默认给**清单声明的全部权限**：预览要看的是「用户全授权之后长什么样」。
  // 以前这里是一份写死的六项列表（storage / plugin.config / plugin.share / events /
  // pet.surface / pet.bubble），于是声明了 llm.chat、net.ws 的插件在预览里永远停在
  // 「没有权限」那一屏——2026-10-29 三个插件页的截图全是那个状态，等于从没被真正看过。
  // `--granted none` 仍然可以复现"什么都没给"的那一屏。
  granted: q.get('granted') === 'none'
    ? []
    : (q.get('granted') ? q.get('granted').split(',').filter(Boolean) : null),
  deny: q.get('deny') === '1',
  state: q.get('state') || 'idle',
  // `--theme light`：宿主给插件的那套配色。真宿主用两条通道（帧地址上的 `?theme=` 与
  // `init.theme`），这里照做——否则预览里永远只有深色，而"浅色下的对比度与描边"恰好是插件
  // 最容易写坏、又最没人看见的地方。
  theme: q.get('theme') === 'light' ? 'light' : 'dark',
  // `--click "#ask-ok"`：等握手与首帧都稳定之后点一下，再继续量/继续截。
  click: q.get('click') || '',
  // `--frame 900x760`：**这个插件的框多大**，而不是清单声明的矩形。
  //
  // 为什么需要它：只在控制中心里挂载的插件（没有 `surface`）没有声明矩形，默认会退回
  // 380×260——那是退休面板的尺寸。拿它去看"间距是否合规、布局是否合理"，看到的是一屏被裁掉
  // 大半的页面，什么问题都看不出来。工作区实际约 720×560，所以给一个真实的框是必要的。
  frameW: Number(q.get('w') || 0),
  frameH: Number(q.get('h') || 0),
  // `--bare`：去掉虚线框、右栏与留白，截图就是插件页面本身。
  bare: q.get('bare') === '1',
};

if (params.bare) {
  // 只加类，**不删节点**：右栏里的 #report/#log 是脚本的记账处，删了它们第一个消息就会抛异常，
  // 而异常发生在握手之前——页面上就是一片空白（这一条是被自己的截图当场抓到的）。
  document.body.classList.add('bare');
}

const els = {
  frame: document.getElementById('frame'),
  bgframe: document.getElementById('bgframe'),
  bgwrap: document.getElementById('bgwrap'),
  card: document.getElementById('card'),
  rect: document.getElementById('rect'),
  slot: document.getElementById('slot'),
  kind: document.getElementById('kind'),
  deny: document.getElementById('deny'),
  reload: document.getElementById('reload'),
  cfg: document.getElementById('cfg'),
  mounts: document.getElementById('mounts'),
  report: document.getElementById('report'),
  log: document.getElementById('log'),
};

let manifest = null;
let rects = [];
/** [{ el, label, host }] — `frames[0]` 是被量的那个（浮层面）。 */
let frames = [];

// 两个帧共用这两份：一个私有存储、一个 share 托盘。真宿主就是这个形状。
const store = createMemoryStore();
const tray = createMemoryStore();

// 浮层面可以请求长高（`surface.blocks` 的 `sizes`）。真宿主把新高度夹在
// [声明高度, maxH] 之间并立刻重排，预览照做——否则"插件会自己长高"这件事在预览里**永远看不见**，
// 能看到的只有声明高度被裁。clipask 的询问卡就是这样：声明 44px、内容 50px，它请求长到 62，
// 而预览一直按 44 量，于是把一块**本来正常**的浮层报成"#ask-yes 底边 50 > 44"。
let grownH = 0;

function currentRect() {
  const r = rects[params.rect] || { w: 380, h: 260, radius: 14 };
  // 显式的框优先：一个没有 surface 的插件（只在控制中心里挂）不该被 380×260 限制。
  return {
    w: Math.round(params.frameW || r.w),
    h: grownH || Math.round(params.frameH || r.h),
    radius: r.radius || 0,
  };
}

/** 按插件的 `surface.blocks` 请求把这一块长高（夹在 [声明高度, maxH]）。 */
function applyBlocksRequest(payload) {
  if (params.kind !== 'surface' || !payload || !payload.sizes) return;
  const want = Number(payload.sizes[String(params.rect)]);
  if (!Number.isFinite(want) || want <= 0) return;
  const r = rects[params.rect] || {};
  const declaredH = Math.round(params.frameH || r.h || 0);
  const maxH = Math.round(r.maxH || declaredH);
  const next = Math.max(declaredH, Math.min(maxH, Math.round(want)));
  if (next === (grownH || declaredH)) return;
  grownH = next;
  applySize();
  scheduleReport();
}

function applySize() {
  const { w, h } = currentRect();
  els.frame.style.width = w + 'px';
  els.frame.style.height = h + 'px';
  els.card.style.width = w + 'px';
  els.card.style.height = h + 'px';
  const declared = Math.round(params.frameH || (rects[params.rect] || {}).h || h);
  els.card.dataset.label = params.frameW || params.frameH
    ? `frame ${w}×${h}`
    : grownH
      ? `declared ${w}×${declared} → 插件请求长高 ${w}×${h}`
      : `declared rect ${w}×${h}`;
}

function logLine(who, dir, text) {
  const row = document.createElement('div');
  row.className = dir === 'out' ? 'dir-out' : dir === 'err' ? 'err' : 'dir-in';
  const tag = document.createElement('span');
  tag.className = 'who';
  tag.textContent = `[${who}] `;
  row.append(tag, `${dir === 'out' ? '→' : dir === 'err' ? '!' : '←'} ${text}`);
  els.log.prepend(row);
}

// --- 尺子 -------------------------------------------------------------------
//
// 这个页面的全部价值。每个画到声明矩形外面的元素都按 id 与数值列出来，因为那正是 jsdom
// 看不见的一类 bug：一张 260 高的卡片，最后一行落在 268，不是"样式小瑕疵"，是一个看不见的按钮。
let reportQueued = false;
function scheduleReport() {
  if (reportQueued) return;
  reportQueued = true;
  // 用 setTimeout 而不是 requestAnimationFrame：无头 + `--virtual-time-budget` 下 rAF 可能
  // 一帧都不再派发，于是 `reportQueued` 永远卡在 true，整页只量了最初那一次——同一个插件就会
  // 一会儿 PASS 一会儿 FAIL（实测 6 次里 2 次报"全在框内"）。定时器在这个模式下一定会跑。
  setTimeout(() => { reportQueued = false; runReport(); }, 0);
}

// 插件的每一次重画都要触发一次测量。只靠定时器不够：`--dump-dom` / `--shot` 落在"插件已经
// 画好、报告还停在上一帧"的那几百毫秒里，同一个插件就会一会儿 PASS 一会儿 FAIL——一个会抖的
// 检查器比没有更坏，所以这里是"谁变了谁负责重报"，定时器退化成兜底。
let frameObserver = null;
function observeFrame(el) {
  try {
    const doc = el.contentDocument;
    if (!doc || !doc.documentElement) return;
    if (frameObserver) frameObserver.disconnect();
    frameObserver = new MutationObserver(scheduleReport);
    frameObserver.observe(doc.documentElement, { subtree: true, childList: true, attributes: true, characterData: true });
  } catch { /* 读不到就是读不到：还有定时器兜底 */ }
}

function runReport() {
  const { w, h } = currentRect();
  const lines = [];
  const el = frames[0] && frames[0].el;
  let doc = null;
  try { doc = el && el.contentDocument; } catch { doc = null; }
  if (!doc || !doc.body) { els.report.className = ''; els.report.textContent = '插件还没加载完…'; return; }
  if (doc.documentElement.scrollHeight > h + 1) {
    lines.push(`内容比卡片高：scrollHeight=${doc.documentElement.scrollHeight} > ${h}`);
  }
  const win = el.contentWindow;
  const walk = (node) => {
    for (const child of node.children) {
      const style = win.getComputedStyle(child);
      // 可见性判据要说清楚：漏一种"看不见"的状态，报出来的就全是假阳性。
      //
      // 旧判据是 `display!=='none' && visibility!=='hidden' && getClientRects().length>0`，它漏掉了
      // **收起的 `<details>` 里的元素**：Chrome 97 起 `<details>` 改用 slot 实现，收起时子元素不再是
      // `display:none`，`getClientRects()` 照样返回一条、`getBoundingClientRect()` 照样给出真实盒子
      // （实测 display=inline-block、bottom=42）。于是"用户根本看不见的输入框"被算成越界。
      // 2026-10-30 就据此误报了 chat 三个浮层面块的 `#imgurl`——截图里那块只画了「图片（可选）」
      // 一行摘要，输入框根本没显示。
      //
      // `checkVisibility()` 就是为这件事加的：对收起 details 里的内容返回 false。有就用它，
      // 没有（老引擎）退回旧判据。
      const visible = typeof child.checkVisibility === 'function'
        ? child.checkVisibility()
        : style.display !== 'none' && style.visibility !== 'hidden' && child.getClientRects().length > 0;
      if (visible) {
        const r = child.getBoundingClientRect();
        const id = child.id ? '#' + child.id : child.tagName.toLowerCase() + (child.className ? '.' + String(child.className).split(' ')[0] : '');
        if (r.bottom > h + 0.5) lines.push(`${id} 底边 ${Math.round(r.bottom)} > ${h}（被下边缘裁掉 ${Math.round(r.bottom - h)}px）`);
        if (r.right > w + 0.5) lines.push(`${id} 右边 ${Math.round(r.right)} > ${w}`);
      }
      walk(child);
    }
  };
  walk(doc.body);
  if (lines.length === 0) {
    els.report.className = 'ok';
    els.report.textContent = `✓ 全部在 ${w}×${h} 之内`;
  } else {
    els.report.className = 'bad';
    els.report.textContent = `✗ ${lines.length} 处越界：\n` + lines.join('\n');
  }
  // `--check` 读的是这两个地方：标题给人一眼看出，data-report 给机器读（--dump-dom）。
  document.title = lines.length === 0 ? 'PREVIEW-OK' : 'PREVIEW-FAIL';
  document.body.dataset.report = JSON.stringify(lines);
}

// --- 接线 -------------------------------------------------------------------
function surfaceFor() {
  const { w, h, radius } = currentRect();
  return {
    kind: params.kind, slot: params.slot, rectIndex: params.rect, rectCount: rects.length || 1,
    rect: { x: 0, y: 0, w, h, r: radius, tailX: 0, hidden: false, room: 160 },
  };
}

function makeFrame(el, label, surface) {
  const host = createFakeHost({
    manifest,
    granted: params.granted || (manifest.permissions || []),
    surface,
    theme: params.theme,
    mode: params.deny ? 'deny' : 'ok',
    answers: (method, payload) => {
      // 插件请求长高时先把框改了，再回答——顺序和真宿主一致（先重排，再回 ok）。
      if (method === 'surface.blocks') applyBlocksRequest(payload);
      return previewAnswers(method, payload, { state: params.state, manifest, store, share: tray });
    },
    deliver: (msg) => el.contentWindow.postMessage(msg, '*'),
  });
  return { el, label, host };
}

function onFrameMessage(event) {
  const frame = frames.find((f) => f.el.contentWindow === event.source);
  if (!frame) return; // 只认我们自己挂的那几个帧，和真宿主一样
  const fromLog = frame.host.log.length;
  const fromErr = frame.host.errors.length;
  frame.host.onMessage(event.data);
  for (const line of frame.host.log.slice(fromLog)) logLine(frame.label, line.dir, line.text);
  for (const err of frame.host.errors.slice(fromErr)) logLine(frame.label, 'err', err);
  scheduleReport();
}

async function boot() {
  manifest = await (await fetch('/plugin/manifest.json')).json();
  rects = manifest.surface || [];
  els.slot.value = params.slot;
  els.kind.value = params.kind;
  els.deny.checked = params.deny;
  rects.forEach((r, i) => {
    const o = document.createElement('option');
    o.value = String(i);
    o.textContent = `${i} (${Math.round(r.w)}×${Math.round(r.h)})`;
    els.rect.append(o);
  });
  if (rects.length === 0) {
    const o = document.createElement('option');
    o.value = '0';
    o.textContent = '0 (panel)';
    els.rect.append(o);
  }
  els.rect.value = String(params.rect);
  applySize();

  frames = [makeFrame(els.frame, 'surface', surfaceFor())];
  // 清单说要常驻帧，就给它一个：隐藏、但在跑。番茄钟的状态机住在这里。
  // 例外是 `workshop`：那是控制中心的挂载方式，而控制中心**不跑常驻帧**（它不服务 events，
  // 见 tools/plugin-market/cc/src/lib/plugin-frame.ts）。在预览里给它一个，等于给了一个
  // 真机没有的计时器，页面上会显示一个永远不会动的界面的"活"版本——那就是假宿主在撒谎。
  const wantsBackground = manifest.background === true && params.slot !== 'workshop';
  if (wantsBackground) {
    frames.push(makeFrame(els.bgframe, 'bg', { kind: 'panel', slot: 'background' }));
  }
  els.mounts.textContent = '挂载：' + frames.map((f) => f.label).join(' + ')
    + (wantsBackground ? '（bg 是隐藏的常驻帧，它才是计时器）'
      : params.slot === 'workshop' ? '（workshop = 控制中心，不挂常驻帧）'
        : '（清单没有声明 background）');

  window.addEventListener('message', onFrameMessage);
  for (const frame of frames) {
    frame.el.addEventListener('load', () => {
      logLine(frame.label, 'in', '（iframe 载入完成）');
      if (frame === frames[0]) observeFrame(frame.el);
      scheduleReport();
    });
    frame.el.src = `/plugin/${manifest.entry}?theme=${params.theme}`;
  }

  els.reload.addEventListener('click', () => location.reload());
  els.cfg.addEventListener('click', () => {
    // 两个帧都收：真宿主的 config.changed 是广播。
    for (const frame of frames) {
      frame.host.send({ v: 1, type: 'event', name: 'config.changed', payload: { pluginId: params.plugin } });
      const line = frame.host.log[frame.host.log.length - 1];
      if (line) logLine(frame.label, line.dir, line.text);
    }
  });
  for (const el of [els.rect, els.slot, els.kind]) {
    el.addEventListener('change', () => {
      const u = new URL(location.href);
      u.searchParams.set('rect', els.rect.value);
      u.searchParams.set('slot', els.slot.value);
      u.searchParams.set('kind', els.kind.value);
      location.href = u.toString();
    });
  }
  els.deny.addEventListener('change', () => {
    const u = new URL(location.href);
    u.searchParams.set('deny', els.deny.checked ? '1' : '0');
    location.href = u.toString();
  });
  new ResizeObserver(scheduleReport).observe(els.frame);
  setInterval(scheduleReport, 500); // 兜底：插件自己按时钟重画时，结论也要跟着刷新

  if (params.click) {
    // 等握手 + 首帧稳定再点：太早点到的是"还没渲染"的节点，截出来的图没有意义。
    setTimeout(() => {
      let target = null;
      try { target = els.frame.contentDocument.querySelector(params.click); } catch { target = null; }
      if (!target) { logLine('surface', 'err', `--click 找不到 ${params.click}`); return; }
      logLine('surface', 'in', `（点击 ${params.click}）`);
      target.click();
      scheduleReport();
      // 一次点击要走完一圈：浮层面发 command → 常驻帧下一秒读到并应用 → 写回 state →
      // 浮层面下一秒读回来重画。所以点完还得让它跑两拍，否则截图会停在"已经点了、还没生效"。
      setTimeout(scheduleReport, 1200);
      setTimeout(scheduleReport, 2400);
    }, 700);
  }
}

boot().catch((err) => {
  els.report.className = 'bad';
  els.report.textContent = '预览启动失败：' + err.message;
  document.title = 'PREVIEW-ERROR';
});
</script>
</body>
</html>
